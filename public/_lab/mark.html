<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}canvas{width:512px;height:512px;display:block}</style>
<script type="importmap">{ "imports": { "three": "/vendor/three.module.min.js", "three/addons/": "/vendor/addons/" } }</script></head>
<body><canvas id="c"></canvas>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { makeNebula, radialTex } from "/js/nebula.js";
const canvas = document.getElementById("c");
const r = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setSize(512, 512, false); r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace; r.setClearColor(0, 0);
const s = new THREE.Scene(); s.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
const cam = new THREE.PerspectiveCamera(22, 1, 0.1, 50); cam.position.set(0, 0, 5.75);
const back = makeNebula(false), front = makeNebula(true);
const T = +(new URLSearchParams(location.search).get("t") || 7.3);
back.uniforms.uTime.value = T; front.uniforms.uTime.value = T;
const g = new THREE.Group(); s.add(g);
g.add(new THREE.Mesh(new THREE.SphereGeometry(1, 96, 64), back));
const eye = new THREE.Group();
eye.add(new THREE.Sprite(new THREE.SpriteMaterial({ map: radialTex("rgba(214,200,255,1)"), blending: THREE.AdditiveBlending, depthWrite: false, opacity: .7 })));
eye.children[0].scale.setScalar(1.3);
eye.add(new THREE.Mesh(new THREE.TorusGeometry(0.33, 0.06, 24, 96), new THREE.MeshBasicMaterial({ color: new THREE.Color(2.4, 2.3, 2.8) })));
eye.position.set(0.04, 0.05, 0.5); g.add(eye);
g.add(new THREE.Mesh(new THREE.SphereGeometry(0.985, 96, 64), front));
g.add(new THREE.Mesh(new THREE.SphereGeometry(1.04, 96, 64), new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.02, transparent: true, opacity: 0.2, clearcoat: 1, envMapIntensity: 3 })));
const key = new THREE.DirectionalLight(0xffffff, 2); key.position.set(-2, 3, 4); s.add(key);
r.render(s, cam); window.done = true;
</script></body></html>
